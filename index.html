<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no">
    <title>volumeshader_bm</title>
    <style>
        body {
            background: #131115;
        }
        #c1 {
            background: #fbf7fe;
        }
        #btn {
            position: fixed;
            left: 0px;
            top: 0px;
        }
        #c1 {
            position: fixed;
            left: 0px;
            top: 0px;
        }
        #main {
            transform-origin: 0px 0px;
            position: fixed;
            left: 0px;
            top: 0px;
        }
        #config {
            position: fixed;
            left: 0px;
            top: 30px;
            display: none;
        }
        #fps {
            position: fixed;
            right: 0px;
            top: 0px;
            color: #0f0;
            background: rgba(0,0,0,0.5);
            font-family: monospace;
            font-size: 14px;
            padding: 2px 6px;
            z-index: 10;
        }
    </style>
</head>
<body style="overflow-x:hidden;overflow-y:hidden">
<div id="main">
    <canvas id="c1" width="1024" height="1024">
        <span>不支持canvas浏览器</span>
    </canvas>
</div>
    <button id="btn">CONFIG</button>
    <div id="config">
        <textarea name="" id="kernel" cols="30" rows="10"></textarea>
        <br />
        <button id="apply">APPLY</button>
        <button id="cancle">CANCLE</button>
    </div>
    <div id="fps">FPS: --</div>
    <script type="module">
        import init from './pkg/vsbm.js';
        init().catch(function(e) {
            console.error('vsbm init failed:', e);
            alert('vsbm init failed: ' + (e && e.message ? e.message : e));
        });
    </script>
</body>
</html>
